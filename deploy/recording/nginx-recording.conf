# Recording API, management page and Bailian download links on their own port.
# Install as /etc/nginx/sites-available/xiaozhi-recording and link it into sites-enabled.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name notify.example.com;
    ssl_certificate /etc/letsencrypt/live/notify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notify.example.com/privkey.pem;
    client_max_body_size 1k;

    location /recording-dl/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /recording-api/ {
        limit_except GET DELETE POST { deny all; }
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
