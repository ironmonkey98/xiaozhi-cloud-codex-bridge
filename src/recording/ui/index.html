<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>录音管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23c63d32%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>录音管理</h1>
    <button id="logout" class="link" hidden>退出</button>
  </header>

  <form id="login" hidden>
    <p>输入录音 API 访问令牌（64 位）。令牌只保存在本浏览器。</p>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="访问令牌" required>
    <button type="submit">进入</button>
    <p id="login-error" class="error" hidden></p>
  </form>

  <main id="app" hidden>
    <form id="search">
      <input id="q" type="search" placeholder="搜索转写内容" maxlength="100">
      <button type="submit">搜索</button>
      <button type="button" id="refresh" class="secondary">刷新</button>
    </form>
    <p id="status" class="muted"></p>
    <ul id="list"></ul>
  </main>

  <dialog id="detail">
    <div class="detail-head">
      <h2 id="d-title"></h2>
      <button id="d-close" class="link" aria-label="关闭">关闭</button>
    </div>
    <p id="d-meta" class="muted"></p>
    <audio id="d-audio" controls preload="none"></audio>
    <div class="actions">
      <button id="d-copy" class="secondary">复制全文</button>
      <button id="d-download" class="secondary">下载音频</button>
      <button id="d-delete" class="danger">删除</button>
    </div>
    <p id="d-note" class="muted"></p>
    <ol id="d-sentences"></ol>
  </dialog>
</body>
</html>
